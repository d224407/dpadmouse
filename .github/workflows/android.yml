name: Android CI

on:
  push:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: 1.0.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ env.HAS_KEYSTORE }}
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_CONTENT != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build evgrab helper (NDK)
        run: sh tools/build-evgrab.sh

      - name: Prepare release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_CONTENT: ${{ secrets.KEYSTORE_CONTENT }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_CONTENT" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEYSTORE_ALIAS" "$KEYSTORE_PASSWORD" \
            > keystore.properties

      - name: Build release APK
        run: |
          ./gradlew assembleRelease -PappVersionCode=$VERSION_CODE -PappVersionName=$VERSION_NAME
          mv app/build/outputs/apk/release/*.apk "dpadmouse-v$VERSION_NAME.apk"

      # A single file: it sits at the root of the artifact zip.
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: dpadmouse-v${{ env.VERSION_NAME }}.apk

  # Releases are published from main only; other branches just build and upload artifacts.
  release:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release APK
        uses: actions/download-artifact@v8
        with:
          name: apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION_NAME" "dpadmouse-v$VERSION_NAME.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$VERSION_NAME" --generate-notes
